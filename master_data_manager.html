<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <title>Master Data Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(255,255,255,0.2);
            padding: 15px 30px;
            border-radius: 10px;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-warning {
            background: #ffc107;
            color: #000;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .modal-header h2 {
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            color: #999;
            line-height: 1;
        }

        .close-btn:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 5px;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .stats {
                gap: 15px;
            }

            .stat-box {
                padding: 10px 20px;
            }

            .toolbar {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Master Data Manager</h1>
            <p>Manage your sewadar records</p>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-number" id="totalRecords">0</div>
                    <div class="stat-label">Total Records</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="filteredRecords">0</div>
                    <div class="stat-label">Showing</div>
                </div>
            </div>
        </div>

        <div class="content">
            <div id="alertBox" class="alert"></div>

            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search by name, contact, badge...">
                </div>
                <button class="btn btn-primary" onclick="openAddModal()">➕ Add New Record</button>
                <button class="btn btn-success" onclick="exportData()">💾 Export JSON</button>
                <button class="btn btn-warning" onclick="importData()">📁 Import JSON</button>
                <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="handleFileImport(event)">
            </div>

            <div id="loadingDiv" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading data...</p>
            </div>

            <div id="tableContainer" class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Sr.</th>
                            <th>Name</th>
                            <th>Father/Husband Name</th>
                            <th>Gender</th>
                            <th>Age</th>
                            <th>Contact</th>
                            <th>Badge ID</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📭</div>
                <h3>No records found</h3>
                <p>Add your first record to get started</p>
            </div>

            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="recordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Record</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <form id="recordForm" onsubmit="saveRecord(event)">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="father_name">Father/Husband/Mother Name</label>
                    <input type="text" id="father_name">
                </div>

                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" min="0" max="150">
                </div>

                <div class="form-group">
                    <label for="aadhar">Aadhar Number</label>
                    <input type="text" id="aadhar" pattern="[0-9]{12}" maxlength="12" placeholder="12 digits">
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address">
                </div>

                <div class="form-group">
                    <label for="contact">Contact Number *</label>
                    <input type="tel" id="contact" pattern="[0-9]{10}" maxlength="10" required placeholder="10 digits">
                </div>

                <div class="form-group">
                    <label for="badge">Badge ID</label>
                    <input type="text" id="badge">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let masterData = [];
        let filteredData = [];
        let currentPage = 1;
        let recordsPerPage = 20;
        let editingIndex = -1;

        // Load data on page load
        window.addEventListener('load', loadData);

        async function loadData() {
            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('tableContainer').style.display = 'none';
            
            try {
                // Try multiple paths for different deployment scenarios
                let response;
                const paths = [
                    'static/master_data.json',           // GitHub Pages / root deployment
                    './static/master_data.json',         // Local server
                    '../static/master_data.json'         // Alternative path
                ];
                
                let lastError;
                for (const path of paths) {
                    try {
                        response = await fetch(path);
                        if (response.ok) {
                            break;
                        }
                    } catch (e) {
                        lastError = e;
                    }
                }
                
                if (!response || !response.ok) {
                    throw new Error(`Failed to load data. Status: ${response?.status || 'Network error'}`);
                }
                
                masterData = await response.json();
                filteredData = [...masterData];
                updateStats();
                renderTable();
                showAlert('Data loaded successfully!', 'success');
            } catch (error) {
                console.error('Error loading data:', error);
                masterData = [];
                filteredData = [];
                showAlert('Error loading data. Starting with empty dataset.', 'error');
            } finally {
                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('tableContainer').style.display = 'block';
            }
        }

        function updateStats() {
            document.getElementById('totalRecords').textContent = masterData.length;
            document.getElementById('filteredRecords').textContent = filteredData.length;
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            
            if (filteredData.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                document.getElementById('tableContainer').style.display = 'none';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            emptyState.style.display = 'none';
            document.getElementById('tableContainer').style.display = 'block';

            const start = (currentPage - 1) * recordsPerPage;
            const end = start + recordsPerPage;
            const pageData = filteredData.slice(start, end);

            tbody.innerHTML = pageData.map((record, index) => {
                const actualIndex = start + index;
                return `
                    <tr>
                        <td>${actualIndex + 1}</td>
                        <td>${record.name}</td>
                        <td>${record.father_name || '-'}</td>
                        <td>${record.gender || '-'}</td>
                        <td>${record.age || '-'}</td>
                        <td>${record.contact || '-'}</td>
                        <td>${record.badge || 'NA'}</td>
                        <td class="actions">
                            <button class="btn btn-sm btn-primary" onclick="editRecord(${actualIndex})">✏️ Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteRecord(${actualIndex})">🗑️ Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');

            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / recordsPerPage);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `
                <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    ← Previous
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `
                        <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                            ${i}
                        </button>
                    `;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<span>...</span>`;
                }
            }

            html += `
                <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    Next →
                </button>
            `;

            pagination.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredData.length / recordsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            
            if (query === '') {
                filteredData = [...masterData];
            } else {
                filteredData = masterData.filter(record => 
                    (record.name && record.name.toLowerCase().includes(query)) ||
                    (record.father_name && record.father_name.toLowerCase().includes(query)) ||
                    (record.contact && record.contact.includes(query)) ||
                    (record.badge && record.badge.toLowerCase().includes(query)) ||
                    (record.address && record.address.toLowerCase().includes(query))
                );
            }
            
            currentPage = 1;
            updateStats();
            renderTable();
        });

        function openAddModal() {
            editingIndex = -1;
            document.getElementById('modalTitle').textContent = 'Add New Record';
            document.getElementById('recordForm').reset();
            document.getElementById('recordModal').classList.add('active');
        }

        function editRecord(index) {
            editingIndex = index;
            const record = filteredData[index];
            
            document.getElementById('modalTitle').textContent = 'Edit Record';
            document.getElementById('name').value = record.name || '';
            document.getElementById('father_name').value = record.father_name || '';
            document.getElementById('gender').value = record.gender || '';
            document.getElementById('age').value = record.age || '';
            document.getElementById('aadhar').value = record.aadhar || '';
            document.getElementById('address').value = record.address || '';
            document.getElementById('contact').value = record.contact || '';
            document.getElementById('badge').value = record.badge || '';
            
            document.getElementById('recordModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('recordModal').classList.remove('active');
            document.getElementById('recordForm').reset();
            editingIndex = -1;
        }

        function saveRecord(event) {
            event.preventDefault();
            
            const record = {
                name: document.getElementById('name').value,
                father_name: document.getElementById('father_name').value,
                gender: document.getElementById('gender').value,
                age: document.getElementById('age').value ? parseInt(document.getElementById('age').value) : '',
                aadhar: document.getElementById('aadhar').value,
                address: document.getElementById('address').value,
                contact: document.getElementById('contact').value,
                badge: document.getElementById('badge').value || 'NA'
            };

            if (editingIndex >= 0) {
                // Find the record in masterData
                const originalRecord = filteredData[editingIndex];
                const masterIndex = masterData.findIndex(r => r === originalRecord);
                masterData[masterIndex] = record;
                filteredData[editingIndex] = record;
                showAlert('Record updated successfully!', 'success');
            } else {
                masterData.push(record);
                filteredData.push(record);
                showAlert('Record added successfully!', 'success');
            }

            updateStats();
            renderTable();
            closeModal();
        }

        function deleteRecord(index) {
            if (!confirm('Are you sure you want to delete this record?')) return;
            
            const record = filteredData[index];
            const masterIndex = masterData.findIndex(r => r === record);
            
            masterData.splice(masterIndex, 1);
            filteredData.splice(index, 1);
            
            updateStats();
            renderTable();
            showAlert('Record deleted successfully!', 'success');
        }

        function exportData() {
            const dataStr = JSON.stringify(masterData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `master_data_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
            URL.revokeObjectURL(url);
            showAlert('Data exported successfully!', 'success');
        }

        function importData() {
            document.getElementById('fileInput').click();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!Array.isArray(imported)) {
                        throw new Error('Invalid JSON format');
                    }
                    
                    if (confirm(`Import ${imported.length} records? This will replace current data.`)) {
                        masterData = imported;
                        filteredData = [...masterData];
                        updateStats();
                        renderTable();
                        showAlert(`Successfully imported ${imported.length} records!`, 'success');
                    }
                } catch (error) {
                    showAlert('Error importing file. Please check the JSON format.', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} show`;
            
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }

        // Close modal on outside click
        document.getElementById('recordModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
